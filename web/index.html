<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Khung ứng dụng quản lý homestay — Huấn, Hiếu, Long.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Homestay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Homestay Huấn - Hiếu - Long</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Remove a previously installed Flutter worker so a returning guest gets
    // the current deployment instead of an old cached bundle.
    async function startHhlStay() {
      const cleanupKey = 'hhl-stay-cache-cleaned-v4';
      if ('serviceWorker' in navigator && !sessionStorage.getItem(cleanupKey)) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const oldFlutterWorkers = registrations.filter((registration) =>
          registration.active?.scriptURL.includes('flutter_service_worker.js') ||
          registration.waiting?.scriptURL.includes('flutter_service_worker.js') ||
          registration.installing?.scriptURL.includes('flutter_service_worker.js'));
        if (oldFlutterWorkers.length) {
          sessionStorage.setItem(cleanupKey, '1');
          await Promise.all(oldFlutterWorkers.map((registration) => registration.unregister()));
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames
            .filter((name) => name.startsWith('flutter-'))
            .map((name) => caches.delete(name)));
          location.reload();
          return;
        }
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
      watchForDeploymentUpdates();
    }

    async function watchForDeploymentUpdates() {
      const bundleUrl = new URL('main.dart.js', document.baseURI);
      const getBundleVersion = async () => {
        bundleUrl.searchParams.set('_hhl_check', Date.now().toString());
        const response = await fetch(bundleUrl, {
          method: 'HEAD',
          cache: 'no-store',
        });
        if (!response.ok) return null;
        return [
          response.headers.get('etag'),
          response.headers.get('last-modified'),
          response.headers.get('content-length'),
        ].join('|');
      };

      let loadedVersion;
      try {
        loadedVersion = await getBundleVersion();
      } catch (_) {
        return;
      }
      if (!loadedVersion) return;

      window.setInterval(async () => {
        try {
          const currentVersion = await getBundleVersion();
          if (currentVersion && currentVersion !== loadedVersion) {
            location.reload();
          }
        } catch (_) {
          // Keep the current app usable when offline or temporarily disconnected.
        }
      }, 60_000);
    }

    startHhlStay();
  </script>
</body>
</html>
